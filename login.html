<!DOCTYPE html>
<html>

<head>
    <title>Login - Attendance System</title>
    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #2c3e50;
        }

        .login-box {
            background: white;
            padding: 40px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #1abc9c;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #16a085;
        }

        .note {
            font-size: 12px;
            color: gray;
            margin-top: 10px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>Attendance System</h2>

    <input id="username" placeholder="Username">

    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="note">
        Default: admin / 1234
    </div>

</div>

<script>

function login(){

    fetch("http://localhost:3000/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            username: document.getElementById("username").value,

            password: document.getElementById("password").value

        })

    })

    .then(res => res.json())

    .then(data => {

        if(data.success){

            localStorage.setItem("token", data.token);

            window.location.href = "dashboard.html";

        } else {

            alert("Invalid login");

        }

    });

}

</script>

</body>

</html>
