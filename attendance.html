<!DOCTYPE html>
<html>

<head>
    <title>Attendance Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">

    <style>

        .filter-box {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .filter-box input {
            flex: 1;
            padding: 10px;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <a href="dashboard.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="attendance.html">Attendance</a>
    <a href="#" onclick="logout()">Logout</a>

</div>

<div class="container">

    <h2>Attendance Admin Panel</h2>

    <p>Mark and manage student attendance</p>

    <!-- MARK ATTENDANCE -->
    <select id="studentSelect"></select>

    <select id="status">
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
    </select>

    <button onclick="markAttendance()">
        Submit Attendance
    </button>

    <hr>

    <!-- FILTER -->
    <div class="filter-box">

        <input type="date" id="filterDate">

        <button onclick="filterAttendance()">Filter</button>

        <button onclick="loadAttendance()">Reset</button>

    </div>

    <!-- TABLE -->
    <table>

        <thead>
            <tr>
                <th>Student</th>
                <th>Status</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="attendanceTable"></tbody>

    </table>

</div>

<script src="js/auth.js"></script>

<script>

const API = "http://localhost:3000";


// LOAD STUDENTS INTO DROPDOWN
function loadStudents(){

    fetch(`${API}/students`)
    .then(res => res.json())
    .then(data => {

        let select = document.getElementById("studentSelect");

        select.innerHTML = "";

        data.forEach(student => {

            select.innerHTML += `
                <option value="${student.name}">
                    ${student.name} (${student.registration_number})
                </option>
            `;

        });

    });

}


// MARK ATTENDANCE
function markAttendance(){

    fetch(`${API}/attendance`, {

        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({

            student: document.getElementById("studentSelect").value,
            status: document.getElementById("status").value,
            date: new Date().toISOString().split("T")[0]

        })

    })

    .then(res => res.json())

    .then(data => {

        alert(data.message);

        loadAttendance();

    });

}


// LOAD ALL ATTENDANCE
function loadAttendance(){

    fetch(`${API}/attendance`)
    .then(res => res.json())
    .then(data => renderTable(data));

}


// FILTER BY DATE
function filterAttendance(){

    let date = document.getElementById("filterDate").value;

    fetch(`${API}/attendance`)
    .then(res => res.json())
    .then(data => {

        let filtered = data.filter(a => a.date === date);

        renderTable(filtered);

    });

}


// RENDER TABLE
function renderTable(data){

    let table = document.getElementById("attendanceTable");

    table.innerHTML = "";

    data.forEach(a => {

        table.innerHTML += `
            <tr>
                <td>${a.student}</td>
                <td>${a.status}</td>
                <td>${a.date}</td>
            </tr>
        `;

    });

}

function renderTable(data){

    let table = document.getElementById("attendanceTable");

    table.innerHTML = "";

    data.forEach((a, index) => {

        table.innerHTML += `
            <tr>
                <td>${a.student}</td>
                <td>${a.status}</td>
                <td>${a.date}</td>

                <td>
                    <button onclick="deleteAttendance(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;

    });

}

function deleteAttendance(index){

    fetch(`${API}/attendance/${index}`, {
        method: "DELETE"
    })
    .then(res => res.json())
    .then(data => {

        alert(data.message);
        loadAttendance();

    });

}



// INIT
loadStudents();
loadAttendance();

</script>

</body>

</html>
